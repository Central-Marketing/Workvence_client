name: CI/CD & Deploy to VPS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Test production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SERVER_API_URL: https://devadmin.workvence.com/api
          NEXT_PUBLIC_API_URL: https://devadmin.workvence.com/api
          NEXT_PUBLIC_SOCKET_URL: https://devadmin.workvence.com
          NEXT_PUBLIC_ADMIN_API_URL: https://devadmin.workvence.com/api/admin
          NEXT_PUBLIC_ADMIN_BACKEND_URL: https://devadmin.workvence.com

  build-and-deploy:
    name: Build Docker & Deploy to VPS
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SERVER_API_URL=https://devadmin.workvence.com/api
            NEXT_PUBLIC_API_URL=https://devadmin.workvence.com/api
            NEXT_PUBLIC_SOCKET_URL=https://devadmin.workvence.com
            NEXT_PUBLIC_ADMIN_API_URL=https://devadmin.workvence.com/api/admin
            NEXT_PUBLIC_ADMIN_BACKEND_URL=https://devadmin.workvence.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR || '/var/www/workvence_client' }}"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest repository changes & Docker image..."
            git pull origin main || true
            docker compose pull
            
            echo "Automated restart with docker compose..."
            docker compose up -d --remove-orphans
            
            docker image prune -f
            echo "🎉 Automated deployment complete in $TARGET_DIR!"
